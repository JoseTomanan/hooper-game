      # SampleMoveInput's Spin branch for the ADR-0014 tier-3 citation and the
      # circuit-breaker reasoning against a new gesture-recognition
      # primitive). 'reconstruct' proves a client-initiated "spin"
      # RequestBeginMove payload reconstructs correctly server-side through
      # the SAME ApplyRequestedMove dispatch a real RPC would drive. Each
