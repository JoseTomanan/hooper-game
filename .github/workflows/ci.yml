          godot --headless --path . res://tests/integration/CrossoverSweepTest.tscn -- --harness-scenario=possession-change-no-sweep
          godot --headless --path . res://tests/integration/CrossoverSweepTest.tscn -- --harness-scenario=remote-handside-sweep

      # In-place pivot plant (issue #172, ADR-0010 amendment). Unit tests
      # (HeadingMathTests) already pin the pure HeadingMath.Step state machine;
      # this drives a REAL PlayerController through the REAL Input singleton and
      # the unmodified TickServerOwnPlayer -> SampleMoveInput -> Move() path,
      # proving the plant/pivot gate actually withholds MoveAndSlide()
      # displacement and that the >90° threshold, ~0.35s 180° completion time,
      # and the #172-retuned exports are all live in the shipped wiring, not
      # just correct in isolation. 'exports' checks BackTurnSlowFactor/
      # MaxTurnRateDeg/PivotThresholdDeg; 'flick-180' proves a released flick
      # keeps pivoting to completion with zero displacement and a ~0.35s
      # timing band; 'held-135' proves a sustained >90° hold stays planted
      # until reached, then resumes moving; 'no-plant-boundary' proves an
      # exactly-90° turn never plants; 'committed-cancel' proves starting a
      # committed move (def_steal) cancels an in-progress pivot immediately.
      # Each exits 0=PASS/1=FAIL (ADR-0016).
      - name: Run pivot-plant harness
        run: |
          godot --headless --path . res://tests/integration/PivotPlantTest.tscn -- --harness-scenario=exports
          godot --headless --path . res://tests/integration/PivotPlantTest.tscn -- --harness-scenario=flick-180
          godot --headless --path . res://tests/integration/PivotPlantTest.tscn -- --harness-scenario=held-135
          godot --headless --path . res://tests/integration/PivotPlantTest.tscn -- --harness-scenario=no-plant-boundary
          godot --headless --path . res://tests/integration/PivotPlantTest.tscn -- --harness-scenario=committed-cancel

      # Planted-feet pivot animation clip + AnimationTree wiring (issue #242,
      # the AFK build half of #184's HITL feel verify). PivotPlantTest above
      # only proves the MECHANIC (HeadingMath/Move()); this proves the REAL
      # Player.tscn's AnimationTree state machine actually Travels into the
      # new "Pivot" state while IsPivotingInPlace is true and back to
      # Locomotion once it clears — the presentation wiring, not the math.
      # 'pivot-enters-exits' drives the same ~180° flick as PivotPlantTest's
      # flick-180 and asserts CurrentAnimStateForHarness tracks the flag in
      # lockstep; 'control-locomotion' is the negative control proving plain
      # forward-ish movement (no reversal) never enters Pivot. Whether the
      # clip itself reads as "planted feet, no foot-sliding" stays #184/#173's
      # deferred human feel judgment (ADR-0021) — not asserted here.
      - name: Run pivot-anim harness
        run: |
          godot --headless --path . res://tests/integration/PivotAnimTest.tscn -- --harness-scenario=pivot-enters-exits
          godot --headless --path . res://tests/integration/PivotAnimTest.tscn -- --harness-scenario=control-locomotion

      # Per-move AnimationTree display layer (issue #277). MoveAnimResolverTests
      # (dotnet) already pins ResolveStateName's pure dictionary lookup; this
      # proves the REAL scenes/Player.tscn state machine actually Travels into
      # a per-move state end-to-end, not just that the resolver returns the
      # right string in isolation — the same #257 trap PivotAnimTest's own
      # header documents (Travel() to a missing/misnamed state only logs an
      # engine error, it never throws), so both scenarios assert
      # ActiveAnimNodeForHarness (GetCurrentNode()), never the resolver's own
      # decision. Needs a live ball + Dribbling possession, not just a bare
      # PlayerController: BehindTheBack/BetweenTheLegs are dribble-family
      # committed moves gated by #193's Held-holder dead-dribble check.
      # 'clipped-reaches-permove' begins a BehindTheBack (listed in
      # MoveAnimResolver.ClippedMovePrefixes) and latches that the tree
      # actually entered "BehindTheBackActive" while MovePhase.Active was
      # live, then settled back onto "Locomotion". 'unclipped-stays-generic'
      # is the control: the identical setup with a BetweenTheLegs (deliberately
      # NOT in ClippedMovePrefixes) instead — proves the generic "Active" node
      # is reached and "BetweenTheLegsActive" (a node that doesn't exist in
      # the tree) never appears, which is what makes the first scenario's pass
      # meaningful rather than a harness premise that could never fail.
      # Whether either clip LOOKS right stays #279/#173's deferred human feel
      # judgment (ADR-0021) — only reachability is asserted here.
      - name: Run movekind-anim harness
        run: |
          godot --headless --path . res://tests/integration/MoveKindAnimTest.tscn -- --harness-scenario=clipped-reaches-permove
          godot --headless --path . res://tests/integration/MoveKindAnimTest.tscn -- --harness-scenario=unclipped-stays-generic

      # Rebound-grab cosmetic one-shot (issue #284). Proves the ReboundGrab
      # display state is actually REACHED after a live rebound (grab-fires),
      # and — the load-bearing controls — that it never fires on a clean-catch
      # tipoff or a real made-basket inbound (made-basket-no-grab), plus that
      # the latch re-arms per recovery (consecutive-rebounds). grab-fires is the
      # positive that makes the "no grab" control non-vacuous; made-basket-no-grab
      # runs a genuine cleared make (asserted InFlight -> make-it-take-it) so its
      # "no grab" is meaningful, not a shot that simply never made. Whether the
      # catch clip LOOKS right stays #173's deferred feel judgment (ADR-0021).
      - name: Run rebound-grab harness
        run: |
          godot --headless --path . res://tests/integration/ReboundGrabTest.tscn -- --harness-scenario=grab-fires
          godot --headless --path . res://tests/integration/ReboundGrabTest.tscn -- --harness-scenario=made-basket-no-grab
          godot --headless --path . res://tests/integration/ReboundGrabTest.tscn -- --harness-scenario=consecutive-rebounds

      # Live-dribble neutral stance (issue #285). Proves the Dribble
      # BlendSpace1D display state is actually REACHED when a holder starts a
      # real dribble (dribble-entered, via the production BallController.
      # TryStartDribble path), and — the load-bearing controls — that it never
      # appears for the player WITHOUT the ball (no-ball-locomotion) or for a
      # holder whose ball is merely Held (held-no-dribble). That last one is the
      # ADR-0014 design call #285 recorded, made assertable: the stance is gated
      # on BallState.Dribbling, not on possession, because a live-dribble loop on
      # a dead dribble advertises a drive the holder cannot legally make — an
      # actively false read. move-outranks-dribble pins the precedence and proves
      # the Dribble -> per-move Startup edge really exists in the .tscn (a
      # missing transition would only make Travel() silently no-op).
      #
      # Both controls assert their own premise in the same run (the holder
      # genuinely reached "Dribble"; the ball genuinely stayed Held), so neither
      # can pass on a rig where nothing happened. Two mutations were used to
      # confirm they discriminate: forcing DisplayDribbling false kills all but
      # held-no-dribble, and re-gating it on possession instead of Dribbling
      # kills ONLY held-no-dribble. Whether the dribble clip LOOKS right stays
      # #173's deferred feel judgment (ADR-0021).
      - name: Run dribble-loop harness
        run: |
          godot --headless --path . res://tests/integration/DribbleLoopTest.tscn -- --harness-scenario=dribble-entered
          godot --headless --path . res://tests/integration/DribbleLoopTest.tscn -- --harness-scenario=no-ball-locomotion
          godot --headless --path . res://tests/integration/DribbleLoopTest.tscn -- --harness-scenario=held-no-dribble
          godot --headless --path . res://tests/integration/DribbleLoopTest.tscn -- --harness-scenario=move-outranks-dribble

      # Dribble hand-side/animation alignment (issue #294). Written first on
      # branch test/dribble-hand-alignment-baseline and registered COMMENTED
      # OUT, because it was deliberately red: it IS the statement of the defect.
      # #294 is the work that turns it green, so it lands live here.
      #
      # The defect it pinned: BallController.TickDribbling places the ball at
      # holderPos + forward*offset + HandRight(forward)*HandOffset*
      # HandSign(holder.HandSide) — server-authoritative, ADR-0012 — but
      # scenes/Player.tscn's Dribble state was a SINGLE BlendSpace1D with no
      # hand-side split, so one clip played regardless, and it was measured to
      # animate the RIGHT hand (pump range 0.3450 m vs 0.0087 m, 39.58x). Every
      # possession where the hand was Left — i.e. after any crossover — put the
      # ball and the animated hand on opposite sides of the body.
      #
      # 'hand-alignment-left' / 'hand-alignment-right' are a matched pair: each
      # FORCES its polarity (neither reads the ADR-0012 reset default, which
      # flipped to Right on 2026-07-28 and silently inverted what these scenarios
      # tested), then asserts three things over one window — the tree was in
      # Dribble<Hand> and nothing else (#257: read via GetCurrentNode, not via
      # MoveAnimResolver's return value), the ball and the animated hand share a
      # lateral sign every tick, and the clip's pump excursion is DOMINATED by
      # the expected hand.
      #
      # That last one is the load-bearing assertion and the reason this file
      # cannot just measure geometry. The Y Bot rig is mirror-symmetric across
      # X=0 to 0.17 mm, so a left/right-SYMMETRIC assertion passes on a broken
      # mirror — exactly how the #255 mirror bug shipped green. The dominance
      # ratio is non-symmetric by construction: it names which hand, and by how
      # much.
      #
      # 'hand-follows-authoritative-flip' is the direct statement of the defect
      # and was the red one: dribble Left, latch, flip to Right, latch again.
      # The ball's lateral sign flipped even before the fix (it reads
      # authoritative HandSide every tick); the animated hand's did not. Both
      # must flip now, and the tree must have been in DribbleLeft for window 1
      # and DribbleRight for window 2.
      #
      # 'dribble-states-own-clips' is structural and reads the state machine
      # straight off Player.tscn: each polarity's BlendSpace1D points at ITS OWN
      # clip pair (an ALLOWLIST — the split's 72 transition sub-resources were
      # generated, and generated wiring fails by pointing a state at a real but
      # WRONG-polarity clip, which reads correct by state name and passes any
      # blocklist), the unsuffixed "Dribble" state is gone, the two polarities
      # are edge-symmetric, and the DribbleLeft<->DribbleRight pair exists.
      # Structural because Travel()'s pathfinder routes around a missing edge
      # (proven by mutation, #279), so no runtime GetCurrentNode assertion can
      # detect one.
      #
      # Each exits 0=PASS/1=FAIL (ADR-0016).
      - name: Run dribble-hand-alignment harness
        run: |
          godot --headless --path . res://tests/integration/DribbleHandAlignmentTest.tscn -- --harness-scenario=hand-alignment-left
          godot --headless --path . res://tests/integration/DribbleHandAlignmentTest.tscn -- --harness-scenario=hand-alignment-right
          godot --headless --path . res://tests/integration/DribbleHandAlignmentTest.tscn -- --harness-scenario=hand-follows-authoritative-flip
          godot --headless --path . res://tests/integration/DribbleHandAlignmentTest.tscn -- --harness-scenario=dribble-states-own-clips

      # Independent height/wingspan rig scaling (issue #170), the engine-glue
      # half. RigScaleTests (dotnet) pins the pure RigScale classifier; this
      # proves PlayerRigScaler runs against the REAL imported Y Bot Skeleton3D:
      # the classifier matched a non-zero count of height AND wingspan bones on
      # the actual rig (the silent-no-op guard the doubt review flagged), a
      # height-only scale grew the height chain while leaving the wingspan chain
      # and the Hips root at baseline (write-set independence on the live
      # skeleton), and 1.0 restored the baseline. Prints every imported bone name
      # + classification first, so a wrong Mixamo-naming assumption names the real
      # bones in the log instead of passing vacuously. The proportions eyeball
      # stays #178/#173's deferred human feel judgment (ADR-0021).
      - name: Run rig-scale harness
        run: godot --headless --path . res://tests/integration/RigScaleHarnessTest.tscn -- --harness-scenario=independent-scaling

      # Locomotion clip retarget (issue #267): idle/run/pivot in
      # assets/locomotion.res were authored against the Kenney rig's deform
      # bone names (Hips/Chest/LeftUpLeg/...); Y Bot's real Skeleton3D bones
      # are all "mixamorig_"-prefixed, so every track failed to resolve and
      # the player stayed in a T-pose. This asserts every bone track in every
      # clip resolves against the LIVE Player.tscn skeleton (not just an
      # isolated FindBone check), with a vacuous-pass guard on both the
      # library's clip keys and each clip's track count. It does not (and per
      # spike #87 cannot cheaply) assert the pose LOOKS right — that stays
      # the deferred human feel judgment (#178/#173, ADR-0021).
      #
      # It has since accreted the rest of the clip-asset guarantees for
      # assets/locomotion.res: loop modes (#271 — the FBX import default is
      # LOOP_NONE), pivot's rest-delta correction (#273) and upper-body
      # completeness (the turning-T-pose bug), idle<->run blend compatibility
      # (#275), and the #287 continuous-drive corridor sweep. #285 adds the two
      # dribble clips to the resolution/loop families and runs a second corridor
      # sweep against the Dribble BlendSpace1D.
      - name: Run locomotion-clip retarget harness
        run: godot --headless --path . res://tests/integration/LocomotionClipTest.tscn

      # Jumpshot animation states, the state-machine half of #279 (LocomotionClipTest
      # just above pins the four clips' own PROPERTIES; FadeawayTriggerTest pins the
      # pure classification decision against a code-built tree with no AnimationTree
      # at all — neither can see whether scenes/Player.tscn's real state machine
      # actually REACHES JumpshotStartup/JumpshotActive/JumpshotRecovery/
      # FadeawayActive). 'jumpshot-phases' latches all three per-move states in
      # order on a real JumpShot begun through BeginJumpShotForHarness (the same
      # BeginCommittedMove choke point production input reaches). 'fadeaway-active'
      # forces a mid-pivot Heading before release and asserts FadeawayActive
      # appears instead of JumpshotActive; 'no-fadeaway-when-squared-up' is its
      # REQUIRED control (identical setup, Heading squared to the rim instead,
      # asserting JumpshotActive appears and FadeawayActive never does — and
      # asserting its own premise that JumpshotActive was genuinely reached, so it
      # cannot pass on a rig where nothing happened). 'no-placeholder-leak' is a
      # second control: while the same real jumpshot runs, the tree must never be
      # observed on the shared generic "Startup"/"Active"/"Recovery" states #279
      # moved jumpshot OFF of (again asserting its own premise — the jumpshot
      # genuinely ran end to end).
      #
      # Proven red under two complementary temporary mutations (both reverted
      # before commit). Each one reddens ALL FOUR scenarios — the four share one
      # setup path, so any break in it fails every scenario. What makes them
      # complementary is therefore not WHICH scenarios go red but the DIAGNOSTIC
      # each reports, and those are what the controls exist to distinguish:
      #
      #   (A) drop "jumpshot" from MoveAnimResolver.ClippedMovePrefixes —
      #       no-placeholder-leak fails on its OWN leak assertion
      #       (sawGenericPlaceholder=True), i.e. the requested state silently fell
      #       back to the shared placeholder. That is the failure mode no unit
      #       test on the resolver can catch: ResolveStateName still returns a
      #       string naming a state that really exists, so Travel() succeeds and
      #       the mesh animates the WRONG clip with nothing logged.
      #       fadeaway-active fails here too, reporting sawStartup=False AND
      #       sawFadeawayActive=False. Read that second False carefully: it does
      #       NOT mean this mutation broke the fadeaway axis. FadeawayActive is an
      #       unprefixed, shared state name, so ClippedMovePrefixes cannot reach
      #       it — and before _sawFadeawayActive was chained behind
      #       _sawJumpshotStartup it did latch True under this exact mutation.
      #       The chain is what masks it: the mutation breaks Startup, so the
      #       gate never opens. Worth knowing before diagnosing a future red here
      #       as a fadeaway regression when it is really a prefix-table break.
      #
      #   (B) invert FadeawayTriggerResolver.IsFadeaway's angle comparison — the
      #       two fadeaway scenarios flip in OPPOSITE directions: fadeaway-active
      #       loses FadeawayActive and gains JumpshotActive, while
      #       no-fadeaway-when-squared-up loses JumpshotActive and gains
      #       FadeawayActive. That opposite flip is the proof they are genuinely
      #       complementary rather than two spellings of one assertion — neither
      #       could be deleted without losing coverage. no-placeholder-leak fails
      #       on its PREMISE here (sawGenericPlaceholder=False), the exact
      #       complement of how it failed under (A), so both halves of that
      #       control are exercised across the pair.
      #
      # Whether either clip LOOKS right stays #279/#173's deferred human feel
      # judgment (ADR-0021).
      #
      # The last three scenarios are #316. That issue proposed RE-AUTHORING these
      # clips in headless Blender; all three of its stated justifications were
      # measured against the shipped locomotion.res first and none survived (the
      # clips are resampled MOCAP, not hand-keyed; their only untracked bones are
      # inert leaf terminators; and the grounding it wanted proven was already
      # true). The re-author was dropped and these gates were added in its place,
      # because the one real gap was that none of it was asserted in CI. The full
      # measurement and the mutation table live in JumpshotAnimTest.cs's header —
      # read it before re-opening the re-author.
      #
      #   jumpshot-airborne-active          the shooter is off the floor for ALL
      #                                     of the 4-tick release. Reduces with
      #                                     MIN, not max: a max-reduction passed
      #                                     on a grounded Active clip because the
      #                                     first Active tick still carries
      #                                     Startup's airborne pose (README trap
      #                                     17, mutation-proven).
      #   control-jumpshot-grounded-startup the takeoff happens INSIDE the 18-tick
      #                                     wind-up — grounded at its low point,
      #                                     airborne at its high point. Two-sided
      #                                     because each half alone is satisfied
      #                                     by a real defect. Also asserts its own
      #                                     premise (the same run's Active reading)
      #                                     so a frozen toe instrument, which is
      #                                     "grounded" too, cannot pass it.
      #   jumpshot-track-completeness       every NON-LEAF rig bone is animated by
      #                                     all four clips. Deliberately not a
      #                                     coverage percentage: the clips are
      #                                     52/65 = 80% and that is CORRECT, since
      #                                     the 13 gaps are leaf terminators that
      #                                     can drag no subtree to the T-pose rest.
      - name: Run jumpshot-animation state harness
        run: |
          godot --headless --path . res://tests/integration/JumpshotAnimTest.tscn -- --harness-scenario=jumpshot-phases
          godot --headless --path . res://tests/integration/JumpshotAnimTest.tscn -- --harness-scenario=fadeaway-active
          godot --headless --path . res://tests/integration/JumpshotAnimTest.tscn -- --harness-scenario=no-fadeaway-when-squared-up
          godot --headless --path . res://tests/integration/JumpshotAnimTest.tscn -- --harness-scenario=no-placeholder-leak
          godot --headless --path . res://tests/integration/JumpshotAnimTest.tscn -- --harness-scenario=jumpshot-airborne-active
          godot --headless --path . res://tests/integration/JumpshotAnimTest.tscn -- --harness-scenario=control-jumpshot-grounded-startup
          godot --headless --path . res://tests/integration/JumpshotAnimTest.tscn -- --harness-scenario=jumpshot-track-completeness

      # Crossover hand-side animation states (issue #280). Player.tscn now
      # carries SIX crossover states (Crossover{Startup,Active,Recovery}
      # {Left,Right}) instead of three unsuffixed ones, because
      # MoveAnimResolver.OriginHand corrects for a crossover flipping
      # PlayerController.HandSide mid-move (at Active-entry) so the suffix
      # names the hand the ball STARTED in and stays constant for the whole
      # move. 'crossover-left-origin' / 'crossover-right-origin' each prove
      # the tree is observed on that polarity's Startup -> Active -> Recovery
      # states, in order, for a crossover begun in that starting hand (the
      # right-origin precondition is forced via the new
      # PlayerController.SetHandSideForHarness seam, since a fresh possession
      # always resets HandSide to Left). 'crossover-single-polarity' is the
      # LOAD-BEARING scenario: over one crossover it latches every DISTINCT
      # crossover state name the live tree actually reported and asserts they
      # all carry the SAME hand suffix — this is what catches a per-tick
      # HandSide read (the exact bug OriginHand exists to prevent), which
      # would show Startup on one polarity and Active/Recovery on the other.
      # It does not re-derive the expected names from the resolver; it only
      # compares what was observed against itself. 'no-unsuffixed-crossover-
      # state' is a CONTROL: the old unsuffixed "CrossoverStartup"/
      # "CrossoverActive"/"CrossoverRecovery" states were renamed away by
      # #280, so this asserts the tree is NEVER observed on one of those bare
      # names during a crossover (after first proving, as its own premise,
      # that a crossover genuinely produced some crossover-state observation
      # at all) — guarding against a regression that reintroduced them, which
      # would let Travel() silently bypass the mirror entirely. All four were
      # verified RED under a temporary mutation of MoveAnimResolver.OriginHand
      # to a naive per-tick HandSide read: the two origin scenarios failed
      # (never reached their Active/Recovery state), crossover-single-polarity
      # failed on a genuine Left/Right mix, and no-unsuffixed-crossover-state
      # stayed green (an orthogonal control, unaffected by this mutation) —
      # then GREEN again after reverting. Each exits 0=PASS/1=FAIL (ADR-0016).
      - name: Run crossover hand-side animation state harness
        run: |
          godot --headless --path . res://tests/integration/CrossoverAnimTest.tscn -- --harness-scenario=crossover-left-origin
          godot --headless --path . res://tests/integration/CrossoverAnimTest.tscn -- --harness-scenario=crossover-right-origin
          godot --headless --path . res://tests/integration/CrossoverAnimTest.tscn -- --harness-scenario=crossover-single-polarity
          godot --headless --path . res://tests/integration/CrossoverAnimTest.tscn -- --harness-scenario=no-unsuffixed-crossover-state

      # Behind-the-back hand-side animation states (issue #281). Same shape as
      # #280's crossover family immediately above — Player.tscn now carries
      # SIX behind-the-back states (BehindTheBack{Startup,Active,Recovery}
      # {Left,Right}) instead of three unsuffixed ones, and the three
      # unsuffixed states are DELETED (not merely unreachable): HandSide is
      # two-valued and MoveAnimResolver.OriginHand is total over it, so no
      # third/fallback case can arise. 'btb-left-origin' / 'btb-right-origin'
      # each prove the tree is observed on that polarity's Startup -> Active
      # -> Recovery states, in order, for a move begun in that starting hand.
      # 'btb-single-polarity' is the LOAD-BEARING scenario, same reasoning as
      # crossover's: over one whole move it latches every DISTINCT
      # "BehindTheBack*" state name the live tree actually reported and
      # asserts they all carry the SAME hand suffix — a per-tick HandSide read
      # (the bug OriginHand exists to prevent) would show Startup on one
      # polarity and Active/Recovery on the other, i.e. two suffixes in one
      # run.
      #
      # 'no-unsuffixed-btb-state' and 'control-unsuffixed-probe' replace
      # crossover's single statistical control with a DIRECT pair: both issue
      # AnimationNodeStateMachinePlayback.Travel() straight at a literal state
      # name under IDENTICAL setup (a dribbling holder, starting node
      # "Dribble") and observe whether the tree ever reports arriving.
      # 'no-unsuffixed-btb-state' travels to "BehindTheBackActive" — a node
      # that must not exist at all post-#281 — and asserts it is NEVER
      # observed. 'control-unsuffixed-probe' travels to
      # "BehindTheBackActiveLeft" — a node that DOES exist and is reachable
      # via the Dribble->BehindTheBackStartupLeft->BehindTheBackActiveLeft
      # edge chain #281 adds — and asserts it IS observed. The second is the
      # PREMISE for the first: without it, "never reached
      # BehindTheBackActive" would pass vacuously on a probe mechanism that
      # was simply broken (e.g. the wrong AnimationTree node path), not on the
      # unsuffixed state genuinely being gone. This pairing exists because a
      # missing NODE (unlike a missing EDGE, #279's mutation-proven Travel()
      # pathfinder blind spot) cannot be routed around — there is no path to
      # find — so a direct probe is sound here where an edge-deletion probe
      # would not be.
      #
      # 'btb-segment-lengths' asserts each of the six clips' duration matches
      # BehindTheBack.DefaultFrameData's own Startup(6)/Active(3)/Recovery(10)
      # tick windows, read from the C# side rather than hardcoded
      # (tools/rebuild_behindtheback_clips.gd has to duplicate those numbers in
      # GDScript, so this is what makes that duplication safe instead of merely
      # regrettable). Tolerance is a 1e-3s FLOAT-NOISE band, deliberately NOT
      # one tick: a one-tick bar cannot catch a one-tick retune, which is the
      # exact staleness this gate exists for. 'btb-no-placeholder-
      # leak' is the direct statement that #296 is closed for this move: it
      # reads the AnimationNodeStateMachine off scenes/Player.tscn directly
      # and asserts each of the six states points at ITS OWN clip. Note that
      # is an allowlist, not a blocklist against the locomotion/idle
      # placeholder the three original unsuffixed states resolved to — the
      # six new AnimationNodeAnimation sub-resources were hand-authored
      # directly beneath the six crossover ones, so the likelier defect is a
      # state pointing at a real-but-wrong clip (locomotion/crossoveractive
      # left), which a blocklist waves through and which no reachability
      # assertion can see either, the STATE name being correct in that case.
      #
      # 'btb-poses-the-skeleton' closes the gap all the others share. Every
      # scenario above is upstream of the thing that actually matters: they
      # assert reachability, duration and the state->clip mapping, none of
      # which requires the clip's tracks to BIND. All seven passed green while
      # the six clips carried track paths of the form
      # "Armature/Skeleton3D:mixamorig_Hips" — one level deeper than the rig,
      # whose skeleton sits at "Skeleton3D" — so every track bound to nothing
      # and the clips were silent no-ops. Godot logs "couldn't resolve track"
      # (2376 times) and carries on; it does not fail. This scenario reads the
      # live Skeleton3D and asserts the upper body is still posed off rest on
      # the LAST behind-the-back tick. Both halves matter and both came from
      # mutation rather than taste: against deliberately-corrupted clips, "max
      # departure from rest" and "max change across the arc" BOTH passed (110
      # deg vs 179 working — the Y Bot rest is a T-pose, and an unbound clip's
      # collapse to rest is itself a large change), while the final-tick
      # reading separates cleanly at 0.0 deg inert vs 179 deg bound.
      # Each exits 0=PASS/1=FAIL (ADR-0016).
      - name: Run behind-the-back hand-side animation state harness
        run: |
          godot --headless --path . res://tests/integration/BehindTheBackAnimTest.tscn -- --harness-scenario=btb-left-origin
          godot --headless --path . res://tests/integration/BehindTheBackAnimTest.tscn -- --harness-scenario=btb-right-origin
          godot --headless --path . res://tests/integration/BehindTheBackAnimTest.tscn -- --harness-scenario=btb-single-polarity
          godot --headless --path . res://tests/integration/BehindTheBackAnimTest.tscn -- --harness-scenario=no-unsuffixed-btb-state
          godot --headless --path . res://tests/integration/BehindTheBackAnimTest.tscn -- --harness-scenario=control-unsuffixed-probe
          godot --headless --path . res://tests/integration/BehindTheBackAnimTest.tscn -- --harness-scenario=btb-segment-lengths
          godot --headless --path . res://tests/integration/BehindTheBackAnimTest.tscn -- --harness-scenario=btb-no-placeholder-leak
          godot --headless --path . res://tests/integration/BehindTheBackAnimTest.tscn -- --harness-scenario=btb-poses-the-skeleton

      # Steal hand-side animation states (issue #282). Same family as the
      # crossover (#280) and behind-the-back (#281) harnesses immediately
      # above, but with a genuinely different discriminator: a steal has no
      # ball to swap sides on, so the six states
      # (Steal{Startup,Active,Recovery}{Left,Right}) are NOT suffixed by
      # MoveAnimResolver.OriginHand (a per-move flip correction) at all — they
      # are suffixed by StealMove.ReachSide, the DEFENDER's OWN body-relative
      # reach side, fixed at construction. 'steal-left-reach' /
      # 'steal-right-reach' each prove the tree is observed on that reach
      # side's Startup -> Active -> Recovery states, in order, for a steal
      # begun via BeginStealFromAimForHarness (the real aim -> TargetHand
      # production mapping, not a hand-picked construction).
      #
      # 'steal-constant-polarity' is LOAD-BEARING: unlike crossover/
      # behind-the-back, a steal never naturally flips the defender's own
      # HandSide mid-move (the defender isn't the ball holder), so this
      # scenario cannot borrow that natural timing to expose a wrong
      # OriginHand-based implementation the way btb-single-polarity does. It
      # instead TOGGLES the defender's own HandSide continuously (every 3
      # ticks) for the whole run and asserts every distinct Steal* state
      # observed still carries the SAME suffix — proving the resolver is
      # provably unaffected by ballHand, which only a genuine ReachSide-only
      # implementation can be.
      #
      # 'steal-face-to-face-reads-true' is the HIGHEST-VALUE scenario in this
      # file. StealMove.TargetHand (the ball-HOLDER's hand under attack) and
      # StealMove.ReachSide (the DEFENDER's own reach side) are related by the
      # #254 facing transform and are EQUAL under the default same-facing
      # headings every other scenario here uses — so a build that suffixes by
      # TargetHand instead of ReachSide (the wrong-but-plausible
      # implementation the original #282 handoff spec called for) would still
      # pass every scenario above. Only a genuine face-to-face geometry
      # (defender heading 180 deg from holder heading, relativeCos = -1),
      # where the two values provably diverge, catches it: this scenario
      # arranges exactly that and asserts the tree entered the ReachSide
      # states (Right here), not the TargetHand states (Left) a mis-suffixed
      # build would enter instead.
      #
      # 'steal-segment-lengths' asserts all six clips' durations match
      # StealMove.DefaultFrameData's own Startup(8)/Active(8)/Recovery(20)
      # tick windows, read from the C# side rather than hardcoded, to within a
      # 1e-3s float-noise band (deliberately NOT one tick — a one-tick bar
      # cannot catch a one-tick retune).
      # 'steal-startup-fills-window' is the SAME instrument scoped
      # to just the Startup pair, reported as its own scenario per the
      # ADR-0018 telegraph requirement (Startup must fill its whole visible
      # wind-up window) rather than folded silently into the all-six check.
      # 'steal-no-placeholder-leak' is the direct statement that #296 is
      # closed for steal: it reads the AnimationNodeStateMachine off
      # scenes/Player.tscn directly and asserts each of the six states points
      # at ITS OWN clip (an allowlist, not merely a locomotion/idle
      # blocklist — a state pointing at a real-but-wrong clip, e.g. a
      # copy-pasted crossover sub-resource, would pass a blocklist and read
      # correct by state name alone).
      #
      # 'steal-poses-the-skeleton' closes the same gap the equivalent
      # behind-the-back scenario does: reachability, duration and the
      # state->clip mapping are all upstream of the clip's tracks actually
      # BINDING to this rig. It reads the live Skeleton3D and asserts the
      # upper body is still posed off REST on the LAST steal tick — the one
      # metric (of three tried, per #281's mutation history) that separates a
      # bound clip from an unbound one on this rig's T-pose rest.
      # 'no-unsuffixed-steal-state' / 'control-unsuffixed-probe' are the same
      # direct-probe pair #281 uses: the first proves Travel("StealActive")
      # never lands (no such node was ever wired for this issue), the second
      # proves the SAME probe mechanism under IDENTICAL setup DOES land on
      # "StealActiveLeft" — the premise the first scenario's pass depends on.
      # Each exits 0=PASS/1=FAIL (ADR-0016).
      - name: Run steal hand-side animation state harness
        run: |
          godot --headless --path . res://tests/integration/StealAnimTest.tscn -- --harness-scenario=steal-left-reach
          godot --headless --path . res://tests/integration/StealAnimTest.tscn -- --harness-scenario=steal-right-reach
          godot --headless --path . res://tests/integration/StealAnimTest.tscn -- --harness-scenario=steal-constant-polarity
          godot --headless --path . res://tests/integration/StealAnimTest.tscn -- --harness-scenario=steal-face-to-face-reads-true
          godot --headless --path . res://tests/integration/StealAnimTest.tscn -- --harness-scenario=steal-segment-lengths
          godot --headless --path . res://tests/integration/StealAnimTest.tscn -- --harness-scenario=steal-startup-fills-window
          godot --headless --path . res://tests/integration/StealAnimTest.tscn -- --harness-scenario=steal-no-placeholder-leak
          godot --headless --path . res://tests/integration/StealAnimTest.tscn -- --harness-scenario=steal-poses-the-skeleton
          godot --headless --path . res://tests/integration/StealAnimTest.tscn -- --harness-scenario=no-unsuffixed-steal-state
          godot --headless --path . res://tests/integration/StealAnimTest.tscn -- --harness-scenario=control-unsuffixed-probe

      # Layup per-move animation states (issue #313, sub of #302 batch 2).
      # Before this, "layup" fell through MoveAnimResolver's default case onto
      # the shared generic states, which per #296 play locomotion/idle for BOTH
      # Startup and Recovery (pixel-identical — an opponent cannot tell
      # "committing" from "in the punish window") and a looping locomotion/run
      # for Active. On a rim attack that is an outright false read (ADR-0003).
      # Unhanded by decision, not omission: the airborne overhead-extension
      # silhouette is already unmistakable, and a handed split can follow.
      #
      # 'layup-phases' reads GetCurrentNode() (never the resolver's return
      # value — the #257 trap: Travel() to a missing state only LOGS).
      # 'layup-no-placeholder-leak' reads the state machine off Player.tscn's
      # SceneState and pins each state to ITS OWN clip — an allowlist, so a
      # state pointing at a real-but-wrong neighbouring clip fails too, which
      # neither a blocklist nor any state-NAME assertion can see.
      # 'layup-segment-lengths' reads the windows from Layup.DefaultFrameData
      # rather than hardcoding them, so a #238 retune that forgets to re-run
      # tools/rebuild_layup_clips.gd goes red here and names the tool.
      # 'layup-edges' is the one edge-level assertion in this family that is
      # legitimate. #279 proved a DELETED edge is invisible to GetCurrentNode()
      # (Travel() is a pathfinder — it routes around the gap), so no runtime
      # scenario can catch one; this reads the transition list directly off the
      # AnimationNodeStateMachine resource, where a missing edge is simply
      # absent. Mutation-verified: deleting tr_lu_su2ac reddens it.
      # The geometric four re-measure on the LIVE Skeleton3D what Blender and
      # the rebuild script already checked resource-side, because neither can
      # see #281's failure — a clip carrying Blender's "Armature/" track-path
      # prefix binds to NOTHING on this rig and is a SILENT no-op that
      # reachability, durations and clip-mapping all still pass.
      # Each positive is paired with a control asserting its own premise:
      # 'control-layup-grounded-startup' proves the hip rise is phase-localised
      # (startup 0.0000 vs active 0.2260) rather than a constant offset, and
      # 'control-layup-arm-low-startup' proves the overhead extension is an
      # event (startup -0.3985 vs active 0.2580, a 0.6565 margin) rather than a
      # pose held throughout. Each exits 0=PASS/1=FAIL (ADR-0016).
      - name: Run layup per-move animation state harness
        run: |
          godot --headless --path . res://tests/integration/LayupAnimTest.tscn -- --harness-scenario=layup-phases
          godot --headless --path . res://tests/integration/LayupAnimTest.tscn -- --harness-scenario=layup-no-placeholder-leak
          godot --headless --path . res://tests/integration/LayupAnimTest.tscn -- --harness-scenario=layup-segment-lengths
          godot --headless --path . res://tests/integration/LayupAnimTest.tscn -- --harness-scenario=layup-edges
          godot --headless --path . res://tests/integration/LayupAnimTest.tscn -- --harness-scenario=layup-startup-differs-from-recovery
          godot --headless --path . res://tests/integration/LayupAnimTest.tscn -- --harness-scenario=layup-airborne-active
          godot --headless --path . res://tests/integration/LayupAnimTest.tscn -- --harness-scenario=control-layup-grounded-startup
          godot --headless --path . res://tests/integration/LayupAnimTest.tscn -- --harness-scenario=layup-arm-extends-overhead
          godot --headless --path . res://tests/integration/LayupAnimTest.tscn -- --harness-scenario=control-layup-arm-low-startup

      # Contest per-move clips (issue #314, #302 batch 2). Same shape as the
      # layup harness above, with the load-bearing gate INVERTED: block and
      # contest raise the same arms, so the feet are the entire legibility read
      # and ContestMove.cs:53-54's commitment ladder (contest 6 < steal 8 <
      # block 10 startup) is priced on it.
      #
      # contest-stays-grounded is therefore the one that matters, and "the feet
      # stayed down" is the most vacuously-satisfiable claim in this repo — a
      # rig that never moves, a clip that bound to nothing (#281), or a
      # Skeleton3D the harness failed to find all satisfy it perfectly. So its
      # control changes the MOVE, not the phase: control-layup-leaves-ground
      # drives a Layup through the identical MeasureLowestToe path and asserts
      # it DOES go airborne. Measured 0.0204 (contest, ceiling 0.08) vs 0.3211
      # (layup, floor 0.15) — a 16x separation through one instrument.
      #
      # The handoff asked for control-block-leaves-ground; when #314 landed,
      # block's states still pointed at the locomotion/idle placeholder, so it
      # could not serve and the handoff named layup as the substitute. #283 has
      # since landed block's real clip (measured hip rise 0.3000), so block is
      # now available as a control too — the layup substitute is kept because it
      # is proven and swapping it is a change to #314's proof, not #283's.
      #
      # contest-arms-rise is the positive half (a wrist reached 0.3503 above the
      # head during Active — the same value rebuild_contest_clips.gd's G5
      # measured independently by FK), and control-contest-arms-low-startup
      # proves it is a readable EVENT (startup -0.2900, a 0.6403 margin) rather
      # than a pose held throughout. Each exits 0=PASS/1=FAIL (ADR-0016).
      - name: Run contest per-move animation state harness
        run: |
          godot --headless --path . res://tests/integration/ContestAnimTest.tscn -- --harness-scenario=contest-phases
          godot --headless --path . res://tests/integration/ContestAnimTest.tscn -- --harness-scenario=contest-no-placeholder-leak
          godot --headless --path . res://tests/integration/ContestAnimTest.tscn -- --harness-scenario=contest-segment-lengths
          godot --headless --path . res://tests/integration/ContestAnimTest.tscn -- --harness-scenario=contest-edges
          godot --headless --path . res://tests/integration/ContestAnimTest.tscn -- --harness-scenario=contest-startup-differs-from-recovery
          godot --headless --path . res://tests/integration/ContestAnimTest.tscn -- --harness-scenario=contest-stays-grounded
          godot --headless --path . res://tests/integration/ContestAnimTest.tscn -- --harness-scenario=control-layup-leaves-ground
          godot --headless --path . res://tests/integration/ContestAnimTest.tscn -- --harness-scenario=contest-arms-rise
          godot --headless --path . res://tests/integration/ContestAnimTest.tscn -- --harness-scenario=control-contest-arms-low-startup

      # Block per-move clips (issue #283, #302 batch 2). The EXACT INVERSE of the
      # contest harness above, and the pair should be read together: the two
      # moves raise the same arms off the same source FBX (Goalkeeper Catch
      # Stationary) and are separated by one thing only — block leaves the
      # ground, contest does not. Before #283 all three Block states shared ONE
      # sub-resource pointing at locomotion/idle, i.e. the #296 defect in its
      # most extreme form: the biggest commitment on defence played the same
      # pixels as standing still, for all three phases at once.
      #
      # block-airborne-active is the load-bearing gate and the only assertion in
      # this repo that can tell block from contest — phases-entered,
      # segment-lengths, distinct-clips and arms-overhead are all satisfied
      # identically by a contest. It measures the HIPS (contest measures toes;
      # each move measures the quantity the OTHER one is allowed to move freely)
      # against the ready stance the wind-up begins from, NOT against the Startup
      # minimum: block crouches 0.20 m on purpose, so a squat-and-un-squat that
      # never leaves the floor measures exactly 0.20 m of "rise" against its own
      # trough and would pass a 0.20 m floor while BEING the defect. Against the
      # ready stance that same clip reads 0.00.
      #
      # control-block-grounded-startup is what earns that baseline — it asserts
      # the hips never rise above it during the wind-up, so it really is a ground
      # level and not a point the clip was already travelling through. Unlike
      # contest's control it needs no second MOVE: both readings come from one
      # run of one clip through one MeasureHipHeight path, so a dead instrument
      # (no Skeleton3D, an unbound clip, a surviving "Armature/" track prefix)
      # reads a flat 0 for both — satisfying this ceiling and FAILING the
      # positive gate. It therefore asserts the positive gate's result as its own
      # premise.
      #
      # Measured, and all three instruments agree to four decimals: Blender-side
      # verify_airborne hip_rise_m=0.3000, rebuild_block_clips.gd G4 rise=0.3000
      # (post-FBX-round-trip, by manual FK), and this harness active=0.3000 off
      # the live Skeleton3D, against startup=0.0000. Each exits 0=PASS/1=FAIL
      # (ADR-0016).
      - name: Run block per-move animation state harness
        run: |
          godot --headless --path . res://tests/integration/BlockAnimTest.tscn -- --harness-scenario=block-phases
          godot --headless --path . res://tests/integration/BlockAnimTest.tscn -- --harness-scenario=block-no-placeholder-leak
          godot --headless --path . res://tests/integration/BlockAnimTest.tscn -- --harness-scenario=block-segment-lengths
          godot --headless --path . res://tests/integration/BlockAnimTest.tscn -- --harness-scenario=block-airborne-active
          godot --headless --path . res://tests/integration/BlockAnimTest.tscn -- --harness-scenario=control-block-grounded-startup

      # Moving crossover — momentum-aware burst with left-stick exit (issue
      # #198, ADR-0003 amendment). CrossoverBurstMathTests already pin the
      # pure composition function; this drives a REAL PlayerController
      # through the REAL Input singleton and the unmodified TickServerOwnPlayer
      # -> SampleMoveInput -> TickCommittedMoveBehavior path, proving Startup's
      # GatherDecel genuinely bleeds (not hard-zeroes) momentum and that the
      # composed burst actually lands in Velocity. 'retains-speed' drives the
      # player to speed, throws a crossover with the left stick released to
      # neutral by Active-entry, and asserts speed never hits zero across
      # Startup+Active (the discriminator against the pre-#198 hard-zero
      # model). 'stationary-forward-exit' throws a crossover from a dead stop
      # with the left stick pushed toward the player's forward facing by
      # Active-entry, and asserts the burst gains a forward component —
      # impossible under the pre-#198 pure-lateral-only burst. Each exits
      # 0=PASS/1=FAIL (ADR-0016).
      # 'hesitation-still-hard-zeroes' is the regression guard for the ADR-0003
      # amendment's own scoping claim ("bounded... to the moving crossover
      # only") — a driving player who throws a Hesitation (not a Crossover)
      # must still plant to a hard instant zero, not gain GatherDecel's bleed.
      # 'remote-pending-stick' (code review, #198 fix round) covers the
      # SERVER's copy of a REMOTE player: a node named "2" (TickServerRemotePlayer
      # role) has its exit vector seeded into _pendingRawStick via the harness
      # seam instead of the local Input singleton, proving that path — not just
      # the own-player ReadInput() path the other scenarios exercise — reaches
      # CrossoverBurstMath correctly.
      - name: Run moving-crossover harness
        run: |
          godot --headless --path . res://tests/integration/MovingCrossoverTest.tscn -- --harness-scenario=retains-speed
          godot --headless --path . res://tests/integration/MovingCrossoverTest.tscn -- --harness-scenario=stationary-forward-exit
          godot --headless --path . res://tests/integration/MovingCrossoverTest.tscn -- --harness-scenario=hesitation-still-hard-zeroes
          godot --headless --path . res://tests/integration/MovingCrossoverTest.tscn -- --harness-scenario=remote-pending-stick

      # Behind-the-back (issue #194) — own CommittedMove subclass, shielded
      # transit, narrower exit cone. CrossoverBurstMathExitConeTests/
      # BehindTheBackTests (xUnit) already pin the pure cone-clamp math and
      # the move's class/frame-data contract; this drives the LIVE glue.
      # 'shielded-sweep' boots a real BallController + two PlayerControllers,
      # begins a real BehindTheBack through BeginCommittedMove, and asserts
      # the ball's forward offset goes NEGATIVE (genuinely behind the
      # holder's centerline) during the sweep, with
      # BallController.SweepIsBehindBodyForHarness true — the discriminator
      # against Crossover's in-front sweep. 'narrower-exit-cone' drives the
      # REAL SampleMoveInput -> RequestBeginMove("behindtheback") ->
      # TickCommittedMoveBehavior path with a PURE LATERAL left-stick exit —
      # exactly the input CrossoverBurstMathTests pins as producing zero
      # forward burst for a plain Crossover — and asserts a real forward
      # component appears, proving the move_size_up modifier + narrower cone
      # are wired end-to-end. 'dead-dribble-gate' proves BehindTheBack
      # respects the SAME Held-holder dead-dribble gate (#193) Crossover/
      # Hesitation use. Each exits 0=PASS/1=FAIL (ADR-0016).
      - name: Run behind-the-back harness
        run: |
          godot --headless --path . res://tests/integration/BehindTheBackTest.tscn -- --harness-scenario=shielded-sweep
          godot --headless --path . res://tests/integration/BehindTheBackTest.tscn -- --harness-scenario=narrower-exit-cone
          godot --headless --path . res://tests/integration/BehindTheBackTest.tscn -- --harness-scenario=dead-dribble-gate

      # Between-the-legs (issue #199) — own CommittedMove subclass, the
      # "balanced midpoint" of the crossover family. BetweenTheLegsTests/
      # CrossoverBallSweepTests (xUnit) already pin the pure frame-data
      # contract and the ThroughLegs forward-offset formula; this drives the
      # LIVE glue. 'through-legs-dip' boots a real BallController + two
      # PlayerControllers, begins a real BetweenTheLegs through
      # BeginCommittedMove, and asserts the ball's world-space Y drops close
      # to the floor (BetweenTheLegsDipDepth) with
      # BallController.SweepPathForHarness == ThroughLegs, WHILE the forward
      # offset stays >= 0 throughout — the discriminator against
      # BehindTheBack's sweep, which goes negative instead.
      # 'finesse-selects-betweenthelegs' drives the REAL SampleMoveInput ->
      # RequestBeginMove("betweenthelegs") -> TickCommittedMoveBehavior path
      # holding "move_finesse" (not "move_size_up") during the flick, and
      # asserts DisplayMoveId() reports "betweenthelegs" once Active begins —
      # proving the move_finesse modifier and RPC dispatch are wired
      # end-to-end, distinct from both Crossover and BehindTheBack.
      # 'dead-dribble-gate' proves BetweenTheLegs respects the SAME
      # Held-holder dead-dribble gate (#193) Crossover/Hesitation/
      # BehindTheBack use. Each exits 0=PASS/1=FAIL (ADR-0016).
      - name: Run between-the-legs harness
        run: |
          godot --headless --path . res://tests/integration/BetweenTheLegsTest.tscn -- --harness-scenario=through-legs-dip
          godot --headless --path . res://tests/integration/BetweenTheLegsTest.tscn -- --harness-scenario=finesse-selects-betweenthelegs
          godot --headless --path . res://tests/integration/BetweenTheLegsTest.tscn -- --harness-scenario=dead-dribble-gate

      # Step-back + retreat dribble (issue #197) — the vertical right-stick
      # gesture pair. RightStickGestureRecognizerTests/StepBackBurstMathTests/
      # StepBackTests/RetreatDribbleTests (xUnit) already pin the pure
      # recognizer, burst math, and frame-data contracts; this drives the LIVE
      # glue. 'step-back-gathers' begins a real StepBack through
      # BeginCommittedMove off a live dribble and asserts the Active-entry
      # gather actually reaches dead Held (state=Held, HasDribbled=true) with
      # a nonzero backward burst on the holder's Velocity.
      # 'retreat-dribble-no-gather' is the CONTROL for that assertion — the
      # SAME live-dribble setup with a RetreatDribble instead, asserting the
      # ball stays Dribbling and HasDribbled stays false through the move's
      # ENTIRE lifecycle (guards against a bug that made every committed move
      # gather). 'retreat-dribble-dead-dribble-gate' proves RetreatDribble
      # respects the SAME Held-holder gate Crossover/Hesitation/BehindTheBack
      # use. Each exits 0=PASS/1=FAIL (ADR-0016).
      - name: Run step-back / retreat-dribble harness
        run: |
          godot --headless --path . res://tests/integration/StepBackTest.tscn -- --harness-scenario=step-back-gathers
          godot --headless --path . res://tests/integration/StepBackTest.tscn -- --harness-scenario=retreat-dribble-no-gather
          godot --headless --path . res://tests/integration/StepBackTest.tscn -- --harness-scenario=retreat-dribble-dead-dribble-gate

      # Drive-gather (issue #230, ADR-0022 — M9's rim-finishing vertical,
      # second leaf). DriveGatherTests/DriveGatherMathTests (xUnit) already
      # pin the pure frame-data contract and the steering/burst math; this
      # drives the LIVE glue. 'gather-bleed' proves Startup bleeds
      # pre-existing LATERAL velocity via the SAME hybrid-gather model the
      # burst family already uses (#198), not an instant stop — a
      # harness-asserted momentum profile matched against the exact
      # production formula. 'heading-turn' proves the drive line resolves via
      # the bounded turn-rate HeadingMath.RotateToward path (ADR-0010) — NOT
      # an instant snap to the rim — matched tick-for-tick against the SAME
      # production function. 'gather-to-layup-chain' proves the completed
      # drive-gather plants the holder inside #229's LayupRange and that a
      # REAL Layup, begun through the SAME BeginCommittedMove choke point,
      # actually launches from there. 'dead-dribble-gate' proves DriveGather
      # respects the SAME #193 Held-holder gate Crossover/Hesitation/
      # BehindTheBack/BetweenTheLegs/RetreatDribble already do (code-review
      # fix). Each exits 0=PASS/1=FAIL (ADR-0016).
      - name: Run drive-gather harness
        run: |
          godot --headless --path . res://tests/integration/DriveGatherTest.tscn -- --harness-scenario=gather-bleed
          godot --headless --path . res://tests/integration/DriveGatherTest.tscn -- --harness-scenario=heading-turn
          godot --headless --path . res://tests/integration/DriveGatherTest.tscn -- --harness-scenario=gather-to-layup-chain
          godot --headless --path . res://tests/integration/DriveGatherTest.tscn -- --harness-scenario=dead-dribble-gate

      # Dual-instance harness, increment 1: two headless Godot processes complete
      # a real ENet handshake over localhost. The orchestrator launches a server
      # and a client of the same scene and reads the client's exit code. This is
      # the two-process capability the single-instance smoke test cannot cover —
      # the foundation the server-authoritative verifies (ADR-0002) build on.
      - name: Run dual-instance ENet handshake harness
        run: |
          chmod +x tests/integration/run-net-handshake.sh
          tests/integration/run-net-handshake.sh godot

      # Dual-instance harness, increment 2: the server (multiplayer authority)
      # broadcasts a strictly-increasing authoritative value to the client every
      # physics tick via RPC — the same ReceiveState cadence the real sim uses
      # (ADR-0002). The client passes only after receiving a sustained in-order
      # run, proving authoritative state actually crosses the wire, not just the
      # handshake. This is the mechanism every server-authoritative verify needs.
      - name: Run dual-instance authoritative state-sync harness
        run: |
          chmod +x tests/integration/run-net-state-sync.sh
          tests/integration/run-net-state-sync.sh godot

      # Dual-instance harness, increment 3: the SHIPPED netcode end-to-end. The
      # server boots via NetworkManager.StartDedicatedServer (the headless
      # authoritative-host path, ADR-0007, never before proven on CI — issue #32);
      # the client joins via NetworkManager.JoinGame; the server's SpawnPlayer +
      # the sibling MultiplayerSpawner replicate a server-authored player node to
      # the client, named by peer id (the identity contract). The client passes
      # only once it observes its own node appear. This is the existence-replication
      # channel every server-authoritative dual-instance verify builds on, proven
      # against the real game's NetworkManager rather than throwaway harness code.
      - name: Run dual-instance node-replication harness
        run: |
          chmod +x tests/integration/run-net-node-replication.sh
          tests/integration/run-net-node-replication.sh godot

      # Dual-instance harness: BehindTheBack broadcast-driven shielded sweep
      # (issue #212). The single-instance BehindTheBackTest cannot reach
      # PlayerController.DisplayMoveId()'s _serverMoveId branch — in one
      # process Multiplayer.IsServer() is unconditionally true, so every node
      # reads its LIVE local machine. Here the server (listen-server via
      # NetworkManager.HostGame, so it owns holder node "1") begins a real
      # BehindTheBack; the CLIENT process passes only if, on the SAME
      # live-sweep tick, its own locally-rendered ball flags the sweep
      # behind-body, the remote holder's DisplayMoveId() returns
      # "behindtheback" (the broadcast branch — the client's copy of the
      # opponent never advances a local machine), and the ball's forward
      # offset goes genuinely NEGATIVE behind the holder's centerline. The
      # client's exit code is the verdict (ADR-0016).
      - name: Run dual-instance behind-the-back sweep harness
        run: |
          chmod +x tests/integration/run-net-behindtheback-sweep.sh
          tests/integration/run-net-behindtheback-sweep.sh godot

      # Dual-instance harness: defensive move telegraph + whiff-punish "beaten"
      # cue remote-display sync (issue #102). Proves TWO things the single-
      # instance StealTurnoverTest/BlowByWindowTest structurally cannot: (1)
      # the #69 remote-display fix (DisplayPhaseResolver) also covers a
      # DEFENSIVE committed move — a StealMove's Startup→Active→Recovery arc
      # rendering on a genuine remote client via DisplayMove(), not just the
      # dribble-move family already proven by the BehindTheBack sweep harness
      # above; and (2) the NEW BeatenDisplayResolver/isBeaten broadcast field
      # actually reaches a true remote client's DisplayBeaten() — a narrower
      # predicate than DisplayPhaseResolver's (only the server ever judges a
      # whiff, so even the CLIENT's OWN player must read the broadcast, not
      # just the opponent's). "telegraph": server begins a real StealMove on
      # its own player 1 (ball left Held, so ResolveStealAttempts never runs —
      # a guaranteed natural whiff) and the client must observe the full
      # ordered arc plus the beaten flag, all broadcast-derived, on a process
      # where Multiplayer.IsServer() is false. "control": identical topology,
      # no move ever begun — the client must NEVER observe a non-Inactive
      # phase or DisplayBeaten()==true, the counterfactual proving
      # "telegraph"'s positives are a real effect of the committed move.
      - name: Run dual-instance defensive telegraph harness (telegraph)
        run: |
          chmod +x tests/integration/run-net-defensive-telegraph.sh
          tests/integration/run-net-defensive-telegraph.sh godot telegraph

      - name: Run dual-instance defensive telegraph harness (control)
        run: |
          chmod +x tests/integration/run-net-defensive-telegraph.sh
          tests/integration/run-net-defensive-telegraph.sh godot control

      # Dual-instance harness: exit-vector RPC divergence fix (issue #210).
      # TickClientOwnPlayer (where the new RequestExitVector send site lives)
      # only ever runs on a role that is "!IsServer && IsLocalPlayer" —
      # structurally unreachable in a single offline instance, where
      # Multiplayer.IsServer() is unconditionally true. The CLIENT here drives
      # a REAL Crossover through the unmodified production input path (a
      # genuine right-stick gesture via Input.ActionPress, no
      # BeginXForHarness seam involved for the move itself) and holds a real,
      # distinct left-stick exit direction. The SERVER carries the verdict
      # (a deliberate deviation from this repo's other dual-instance
      # scripts — see NetExitVectorRpcTest.cs's class doc for why). "poisoned":
      # the server's _pendingRawStick is continuously poisoned to the
      # OPPOSITE decoy direction throughout the run — the actual regression
      # proof, since pre-#210 code read that field directly and would have
      # composed the decoy. "steady": no poisoning — the paired control,
      # proving the ordinary unpoisoned path is unaffected.
      - name: Run dual-instance exit-vector RPC harness (poisoned)
        run: |
          chmod +x tests/integration/run-net-exitvector-rpc.sh
          tests/integration/run-net-exitvector-rpc.sh godot poisoned

      - name: Run dual-instance exit-vector RPC harness (steady)
        run: |
          chmod +x tests/integration/run-net-exitvector-rpc.sh
          tests/integration/run-net-exitvector-rpc.sh godot steady
