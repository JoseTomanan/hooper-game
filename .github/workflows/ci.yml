          godot --headless --path . res://tests/integration/InAndOutTest.tscn -- --harness-scenario=reconstruct

      # Spin — the dribble-move family's last leaf (issue #201, ADR-0010
      # amendment). Unit tests already pin the pure heading-arc contract
      # (SpinHeadingMathTests.cs); this proves the LIVE engine glue.
      # 'rotation' proves a real spin rotates the holder's authoritative
      # Heading ~180 degrees (exactly pi radians) from entry to Inactive,
      # THEN proves a control Crossover leaves Heading completely unrotated
      # across its own full lifecycle — the rotation is spin-specific, not an
      # incidental side effect of committed-move ticking. 'handside-swap-timing'
