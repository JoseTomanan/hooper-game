      # required control proving the "unchanged" observation isn't vacuous.
      # 'fallback-toward-ball-hand' proves the stationary+neutral-exit
      # fallback burst travels toward the BALL hand (the negated flick sign),
      # THEN proves a control Crossover under IDENTICAL conditions bursts the
      # OPPOSITE way (toward the empty hand) — pinning the negation is
      # InAndOut-specific. 'dead-dribble-gate' proves InAndOut is refused from
      # both a fresh LIVE Held possession and a DEAD Held possession
      # (HasDribbled=true, post-cradle), with the required control proving it
      # IS permitted from a live Dribbling possession — the specific check
      # that catches a hardcoded-type-list omission (the brief's named single
      # most likely defect for this issue). 'feint-refused' proves Crossover
      # and BehindTheBack are now structurally unfeintable at Startup frame 0
      # (feintWindowFrames: 0, the ADR-0003 amendment), with the required
      # control proving JumpShot's pump-fake still succeeds inside its legal
      # [3, 12) window and NEVER reaches Active (no ball release) — proving
      # the dribble-move refusal is move-specific, not a global feint break.
      # 'reconstruct' proves a client-initiated "inandout" wire payload
      # reconstructs correctly server-side through the SAME ApplyRequestedMove
      # dispatch a real RPC would drive (flick sign intact, HandSide
      # untouched across the reconstructed lifecycle). Each exits
      # 0=PASS/1=FAIL (ADR-0016).
      - name: Run in-and-out harness
