      # 'exit-burst-continues-entry-line' proves the exit burst composes
      # against the ENTRY exit-vector snapshot (captured once at
      # JustEnteredActive), not a live re-read on the last Active tick — proven
      # by comparing a baseline trial (stick held constant) against a switched
      # trial (stick changes right after Active begins) on a FRESH player
      # instance each, isolating the one variable under test from the
      # rotation's own heading change. 'sweep-path' proves the spin's
      # ball-sweep resolves to the NEW BallSweepPath.BodyShield (the ball
      # pulled tight to the rotating body, #201's "third option on #195's
      # sweep geometry"), THEN proves a control Crossover under identical
      # Dribbling conditions resolves to InFront, the pre-existing default —
      # proving BodyShield is spin-specific. 'real-input-trigger' proves a
